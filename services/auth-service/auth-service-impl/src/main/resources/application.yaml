spring:
  application:
    name: auth-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.yaml
    default-schema: public

server:
  port: 8081

foundation:
  security:
    jwt:
      type:
        access: access
        refresh: refresh
        tokens: Bearer
      expiration:
        access: 3600000
        refresh: 2592000000
      algorithm: RSA
      issuer: auth-service
      public-key-path: classpath:keys/public_key.pem
      private-key-path: classpath:keys/private_key_pkcs8.der
