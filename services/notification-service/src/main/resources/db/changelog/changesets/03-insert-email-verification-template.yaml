databaseChangeLog:
  - changeSet:
      id: 03-insert-email-verification-template
      author: xpestilent
      changes:
        - insert:
            schemaName: notification_schema
            tableName: notification_templates
            columns:
              - column:
                  name: code
                  value: 'EMAIL_VERIFICATION'
              - column:
                  name: subject
                  value: 'Добро пожаловать, {recipient}! Подтвердите регистрацию'
              - column:
                  name: html_body
                  value: |
                    <!DOCTYPE html>
                    <html lang="ru" xmlns:th="http://www.thymeleaf.org">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <style>
                            body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
                            .email-container { max-width: 600px; margin: 40px auto; background-color: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; }
                            .header { background-color: #4f46e5; padding: 30px; text-align: center; color: #ffffff; }
                            .header h1 { margin: 0; font-size: 24px; font-weight: 600; }
                            .content { padding: 40px 30px; color: #333333; line-height: 1.6; }
                            .content h2 { font-size: 20px; color: #111827; margin-top: 0; }
                            .btn-container { text-align: center; margin: 35px 0; }
                            .btn { display: inline-block; background-color: #4f46e5; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 6px; font-weight: 600; font-size: 16px; }
                            .footer { background-color: #f9fafb; padding: 20px; text-align: center; color: #6b7280; font-size: 13px; border-top: 1px solid #e5e7eb; }
                            .footer a { color: #4f46e5; text-decoration: none; }
                        </style>
                    </head>
                    <body>
                        <div class="email-container">
                            <div class="header">
                                <h1>Foundation Project</h1>
                            </div>
                            <div class="content">
                                <h2>Привет, <span th:text="${recipient}">Пользователь</span>! 👋</h2>
                                <p>Спасибо за регистрацию в нашем сервисе. Чтобы получить полный доступ ко всем функциям и обезопасить свой аккаунт, пожалуйста, подтвердите свой email.</p>
                    
                                <div class="btn-container">
                                    <a th:href="${verificationUrl}" class="btn" style="color: #ffffff;">Подтвердить Email</a>
                                </div>
                    
                                <p>Если кнопка не работает, скопируйте и вставьте следующую ссылку в адресную строку вашего браузера:</p>
                                <p style="word-break: break-all; color: #4f46e5; font-size: 14px;" th:text="${verificationUrl}">link</p>
                    
                                <p>Если вы не регистрировались у нас, просто проигнорируйте это письмо.</p>
                            </div>
                            <div class="footer">
                                <p>Это автоматическое письмо, на него не нужно отвечать.</p>
                            </div>
                        </div>
                    </body>
                    </html>