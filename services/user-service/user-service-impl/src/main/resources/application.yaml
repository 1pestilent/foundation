spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/foundation_db?currentSchema=user_schema
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.yaml
    default-schema: user_schema

server:
  port: 8082

