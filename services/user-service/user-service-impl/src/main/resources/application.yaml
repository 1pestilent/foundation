spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.yaml
    default-schema: public